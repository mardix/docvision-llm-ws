<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOCVISION-LLM docs</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f1f4f8; --panel: #ffffff; --text: #0f172a; --muted: #64748b; --line: #dce2ea;
    --soft: #e8ecf1; --accent: #4f46e5; --accent-soft: #eef2ff; --ink: #0f172a; --ink-2: #1e293b; --ink-line: #334155;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 24px; height: 58px; padding: 0 24px; background: var(--ink); border-bottom: 1px solid var(--ink-line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .06em; font-size: 13.5px; color: #fff; text-decoration: none; }
  .brand i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #818cf8, #4f46e5); box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset; display: inline-block; }
  .top nav { display: flex; gap: 4px; margin-left: auto; }
  .top nav a { color: #94a3b8; text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 8px; }
  .top nav a:hover { color: #fff; background: var(--ink-2); }
  .top nav a.on { color: #fff; background: var(--ink-2); }
  .wrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 48px; max-width: 1180px; margin: 0 auto; padding: 32px 24px 96px; }
  aside { position: sticky; top: 88px; align-self: start; max-height: calc(100vh - 110px); overflow-y: auto; font-size: 13.5px; }
  aside .label { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  aside a { display: block; color: var(--muted); text-decoration: none; padding: 3px 10px; border-left: 2px solid transparent; }
  aside a:hover { color: var(--text); border-left-color: var(--line); }
  aside a.l2 { color: var(--text); font-weight: 500; margin-top: 6px; }
  aside a.l3 { padding-left: 22px; }
  article { min-width: 0; max-width: 820px; }
  article h1 { font-size: 34px; letter-spacing: -.02em; line-height: 1.2; margin: 0 0 12px; }
  article h2 { font-size: 23px; letter-spacing: -.01em; margin: 48px 0 12px; padding-top: 8px; border-top: 1px solid var(--line); }
  article h3 { font-size: 17px; margin: 32px 0 8px; }
  article h4 { font-size: 15px; margin: 24px 0 8px; }
  article p, article li { color: #1e293b; }
  article a { color: var(--accent); text-decoration: none; }
  article a:hover { text-decoration: underline; }
  article code { font-family: var(--mono); font-size: .86em; background: var(--soft); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
  article pre { background: var(--ink); color: #e2e8f0; padding: 16px 18px; border-radius: 10px; overflow-x: auto; font-size: 13px; line-height: 1.55; }
  article pre code { background: none; border: 0; padding: 0; color: inherit; font-size: inherit; }
  article table { width: 100%; border-collapse: collapse; margin: 14px 0 20px; font-size: 14px; display: block; overflow-x: auto; }
  article th, article td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  article th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; border-bottom-color: #cbd5e1; }
  article tr:hover td { background: var(--panel); }
  article ul { padding-left: 20px; }
  article br { display: none; }
  footer { color: var(--muted); font-size: 13px; margin-top: 64px; }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; padding: 20px 16px 64px; }
    aside { display: none; }
    .top { padding: 0 16px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/_/doc"><i></i>DOCVISION-LLM</a>
  <nav><a class="on" href="/_/doc">Docs</a><a href="/_/dashboard">Dashboard</a></nav>
</header>
<div class="wrap">
  <aside><div class="label">On this page</div>{{TOC}}</aside>
  <article>{{BODY}}<footer>docvision-llm-ws {{VERSION}}</footer></article>
</div>
</body>
</html>
